name: chillspan

services:
  app:
    build: .
    ports:
      - "11440:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:11440/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 12